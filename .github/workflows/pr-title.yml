name: pr-title

# The squash-merge commit subject is the PR title, and Release Please reads that
# subject to decide whether the next release is a feature, a fix, or nothing at
# all. A title that is not a Conventional Commit would silently produce the wrong
# bump, so validate it here and make the check required in the main ruleset.
on:
  # pull_request_target runs the base-branch copy of this file with a token that
  # also works for fork PRs. The action only reads the title, and this workflow
  # never checks out the PR head, so the base-branch token is not exposed.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# A newer title edit supersedes the earlier run.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
