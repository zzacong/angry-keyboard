name: dmg-rehearsal

# Rehearses the release DMG build without cutting a tag, so a release can be
# checked before it happens. It runs the same keychain, build, package, verify,
# and feed steps as the `build` job in release.yml, attests the DMG, and uploads
# the DMG, its checksum, and the signed feed as workflow artifacts instead of
# release assets. The feed's enclosure is relative so the artifacts can be served
# from one directory to run the real update flow; see "Rehearsing an update" in
# docs/signing.md.
#
# Keep the steps here in step with release.yml. Run it from the Actions tab, or:
# gh workflow run dmg-rehearsal.yml

on:
  workflow_dispatch:
    inputs:
      version:
        description: MARKETING_VERSION to stamp into the test build
        required: false
        default: "0.1.0"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-dmg:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Import the production certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build the release app
        env:
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          VERSION: ${{ inputs.version }}
        run: |
          xcodebuild \
            -project AngryKeyboard.xcodeproj \
            -scheme AngryKeyboard \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            build

      - name: Package the DMG
        run: |
          mkdir -p dist/dmg
          cp -R build/Build/Products/Release/AngryKeyboard.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          cp packaging/INSTALL.txt "dist/dmg/Read Me.txt"
          hdiutil create -volname "Angry Keyboard" -srcfolder dist/dmg \
            -ov -format UDZO dist/AngryKeyboard.dmg
          shasum -a 256 dist/AngryKeyboard.dmg \
            | awk '{print $1}' > dist/AngryKeyboard.dmg.sha256

      - name: Verify the signature
        env:
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/Build/Products/Release/AngryKeyboard.app
          codesign -dv --verbose=2 \
            build/Build/Products/Release/AngryKeyboard.app 2>&1 \
            | grep -qF "Authority=$SIGNING_IDENTITY"
          hdiutil attach dist/AngryKeyboard.dmg -nobrowse -readonly
          codesign --verify --deep --strict \
            "/Volumes/Angry Keyboard/AngryKeyboard.app"
          codesign -dv --verbose=2 \
            "/Volumes/Angry Keyboard/AngryKeyboard.app" 2>&1 \
            | grep -qF "Authority=$SIGNING_IDENTITY"
          hdiutil detach "/Volumes/Angry Keyboard"

      # The feed a test build points at to exercise the real update flow. Unlike
      # release.yml this feed is not for installed apps: it travels as an
      # artifact beside the DMG, so its enclosure URL stays relative
      # ("AngryKeyboard.dmg"). Sparkle resolves a relative enclosure against the
      # feed's own URL, so a tester serves the downloaded artifacts from one
      # directory and points a test build's SUFeedURL at the feed. The DMG and
      # its checksum are staged into feed/ with the appcast so the uploaded
      # artifact is a single flat folder and the enclosure resolves. Deltas are
      # off per ADR 0010.
      - name: Generate and sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set; cannot sign the update feed."
            exit 1
          fi

          # Prefer the tools Swift Package Manager resolved beside the build,
          # falling back to the pinned Sparkle release when they are absent.
          GENERATE_APPCAST="build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [ ! -x "$GENERATE_APPCAST" ]; then
            echo "Sparkle's tools are not resolved; downloading Sparkle 2.10.0."
            curl -fsSL --retry 3 -o sparkle.tar.xz \
              https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
            rm -rf sparkle-dist
            mkdir -p sparkle-dist
            tar -xf sparkle.tar.xz -C sparkle-dist
            GENERATE_APPCAST="$(find sparkle-dist -type f -name generate_appcast -print -quit)"
          fi
          if [ ! -x "$GENERATE_APPCAST" ]; then
            echo "::error::generate_appcast was not found."
            exit 1
          fi

          # generate_appcast derives the version from the app inside the archive
          # and writes appcast.xml beside it.
          rm -rf feed
          mkdir -p feed
          cp dist/AngryKeyboard.dmg dist/AngryKeyboard.dmg.sha256 feed/

          # --download-url-prefix ./ overrides the app's own SUFeedURL as the
          # enclosure base, which would otherwise be the published release, and
          # keeps the enclosure relative. The private key travels over stdin and
          # is never written to disk.
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$GENERATE_APPCAST" \
                --ed-key-file - \
                --download-url-prefix ./ \
                --maximum-deltas 0 \
                feed

          if [ ! -s feed/appcast.xml ]; then
            echo "::error::generate_appcast produced no feed."
            exit 1
          fi
          if ! grep -qF 'url="AngryKeyboard.dmg"' feed/appcast.xml; then
            echo "::error::appcast.xml does not name the rehearsal DMG with a relative URL."
            exit 1
          fi
          # generate_appcast skips signing, without failing, when the app's
          # SUPublicEDKey does not match the key. Require a signed enclosure so
          # a mismatched secret fails the rehearsal instead of shipping a feed
          # every installed app would reject.
          if ! grep -q 'sparkle:edSignature' feed/appcast.xml; then
            echo "::error::appcast.xml is unsigned; check that SPARKLE_PRIVATE_KEY matches SUPublicEDKey."
            exit 1
          fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/AngryKeyboard.dmg

      # feed/ holds the appcast, the DMG, and the checksum as siblings, so the
      # artifact unpacks to one flat directory the tester can serve directly.
      - uses: actions/upload-artifact@v7
        with:
          name: AngryKeyboard-dmg-rehearsal
          path: |
            feed/appcast.xml
            feed/AngryKeyboard.dmg
            feed/AngryKeyboard.dmg.sha256

      - name: Remove the certificate
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12
