name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the app job has anything to do. A change that only touches
  # site/ skips the macOS runner, which is the expensive part of this workflow.
  changes:
    runs-on: ubuntu-latest
    # `contents: read` is for checkout. `pull-requests: read` lets the change
    # detection read a pull request's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      # `some-with-excludes` matches a file when it matches at least one
      # positive rule and no negated one, so `app` is true when any changed file
      # lives outside site/. A filter of negated rules alone never matches.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - '**'
              - '!site/**'

  build-and-test:
    # A job skipped by a condition reports Success, which still satisfies the
    # required check. Skipping the whole workflow by path filtering would not:
    # its checks stay pending and block the merge. The tradeoff is that a
    # failure of the `changes` job also skips this one, so keep that job trivial.
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Pinned because the project is written at Xcode 27's objectVersion (110)
    # and will not open in Xcode 26. Xcode 27 only runs on Apple silicon.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # The project is objectVersion 110, which only Xcode 27 opens. Assert the
      # selected toolchain so a wrong-Xcode runner fails here with a clear
      # message instead of deep inside the build.
      - name: Check toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -qE '^Xcode 27\.'

      - name: Run unit tests
        run: xcodebuild test -scheme AngryKeyboard -destination 'platform=macOS'

      - name: Build dev (Debug)
        run: xcodebuild build -scheme AngryKeyboard -configuration Debug -destination 'generic/platform=macOS'

      - name: Build release (Release)
        run: xcodebuild build -scheme AngryKeyboard -configuration Release -destination 'generic/platform=macOS'

  site:
    # Left ungated on purpose. It is cheap on Linux, and running it on every
    # change also covers anything the site build reads from outside site/.
    # The site is a self-contained pnpm package in site/. It needs no Xcode, so
    # it runs on a Linux runner in parallel with the app job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm, then Node from the site's own .node-version. The install
      # runs in site/ and fails if the lockfile is out of date, so a dependency
      # change without a lockfile change is caught here. `version: 12` pins the
      # pnpm major line only.
      - uses: pnpm/setup@v3
        with:
          working-directory: site
          node-version-file: .node-version
          version: 12
          cache: true
          require-lockfile: true

      - name: Typecheck, format check, and lint
        working-directory: site
        run: pnpm run check

      # `check` never runs the StyleX plugin, so only a build proves the
      # stylesheet is actually emitted.
      - name: Build
        working-directory: site
        run: pnpm run build
