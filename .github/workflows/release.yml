name: release

on:
  push:
    branches: [main]

# A newer push to main supersedes an earlier run, which saw fewer commits.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release Please writes the changelog, the version files, and the tag through
# the GitHub API, so it needs write access to the repository and its pull
# requests. Labels live on the issues API, which is why `issues` is granted too.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Opens or updates the release pull request from the conventional commits, and,
  # once that pull request is merged, tags the release and writes its notes. The
  # build job below runs in the same workflow on purpose: a release created with
  # the built-in token does not trigger another workflow, so an `on: release`
  # workflow would never fire.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds, signs, packages, and publishes only when Release Please cut a tag.
  # The identity is the production certificate from ADR 0007: signed, not
  # notarized, so the install warning ships with every artifact.
  build:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: xcode-27
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Import the production certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build the release app
        env:
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
        run: |
          VERSION="${TAG#v}"
          xcodebuild \
            -project AngryKeyboard.xcodeproj \
            -scheme AngryKeyboard \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            build

      - name: Package the DMG
        run: |
          mkdir -p dist/dmg
          cp -R build/Build/Products/Release/AngryKeyboard.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          cp packaging/INSTALL.txt "dist/dmg/Read Me.txt"
          cp CREDITS.md dist/dmg/Credits.md
          cp LICENSE dist/dmg/LICENSE.txt
          hdiutil create -volname "Angry Keyboard" -srcfolder dist/dmg \
            -ov -format UDZO dist/AngryKeyboard.dmg
          shasum -a 256 dist/AngryKeyboard.dmg \
            | awk '{print $1}' > dist/AngryKeyboard.dmg.sha256

      - name: Verify the signature
        env:
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/Build/Products/Release/AngryKeyboard.app
          codesign -dv --verbose=2 \
            build/Build/Products/Release/AngryKeyboard.app 2>&1 \
            | grep -qF "Authority=$SIGNING_IDENTITY"
          hdiutil attach dist/AngryKeyboard.dmg -nobrowse -readonly
          codesign --verify --deep --strict \
            "/Volumes/Angry Keyboard/AngryKeyboard.app"
          codesign -dv --verbose=2 \
            "/Volumes/Angry Keyboard/AngryKeyboard.app" 2>&1 \
            | grep -qF "Authority=$SIGNING_IDENTITY"
          hdiutil detach "/Volumes/Angry Keyboard"

      # The feed the app's SUFeedURL points at. generate_appcast reads the
      # packaged app for its build and marketing versions and signs the
      # enclosure with the EdDSA key, so the asset validates against the public
      # key the app carries. Deltas are off per ADR 0010.
      - name: Generate and sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set; cannot sign the update feed."
            exit 1
          fi

          # Prefer the tools Swift Package Manager resolved beside the build,
          # falling back to the pinned Sparkle release when they are absent.
          GENERATE_APPCAST="build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [ ! -x "$GENERATE_APPCAST" ]; then
            echo "Sparkle's tools are not resolved; downloading Sparkle 2.10.0."
            curl -fsSL --retry 3 -o sparkle.tar.xz \
              https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
            rm -rf sparkle-dist
            mkdir -p sparkle-dist
            tar -xf sparkle.tar.xz -C sparkle-dist
            GENERATE_APPCAST="$(find sparkle-dist -type f -name generate_appcast -print -quit)"
          fi
          if [ ! -x "$GENERATE_APPCAST" ]; then
            echo "::error::generate_appcast was not found."
            exit 1
          fi

          # generate_appcast derives the version from the app inside the archive
          # and writes appcast.xml beside it, so stage the DMG on its own.
          rm -rf feed
          mkdir -p feed
          cp dist/AngryKeyboard.dmg feed/

          # generate_appcast attaches release notes from a file named like the
          # archive; --embed-release-notes folds them into the feed, so Sparkle's
          # dialog shows what changed without a separate notes asset to host.
          gh release view "$TAG" --json body --jq .body > feed/AngryKeyboard.md

          DOWNLOAD_PREFIX="https://github.com/${{ github.repository }}/releases/download/${TAG}/"

          # The private key travels over stdin and is never written to disk.
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$GENERATE_APPCAST" \
                --ed-key-file - \
                --download-url-prefix "$DOWNLOAD_PREFIX" \
                --maximum-deltas 0 \
                --embed-release-notes \
                feed

          if [ ! -s feed/appcast.xml ]; then
            echo "::error::generate_appcast produced no feed."
            exit 1
          fi
          if ! grep -qF "${DOWNLOAD_PREFIX}AngryKeyboard.dmg" feed/appcast.xml; then
            echo "::error::appcast.xml does not point at this release's DMG."
            exit 1
          fi
          # generate_appcast skips signing, without failing, when the app's
          # SUPublicEDKey does not match the key. Require a signed enclosure so
          # a mismatched secret fails the release instead of shipping a feed
          # every installed app would reject.
          if ! grep -q 'sparkle:edSignature' feed/appcast.xml; then
            echo "::error::appcast.xml is unsigned; check that SPARKLE_PRIVATE_KEY matches SUPublicEDKey."
            exit 1
          fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/AngryKeyboard.dmg

      - name: Append the install warning to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --json body --jq .body \
            | grep -qF '## Installing'; then
            echo "Install warning already present; leaving the notes unchanged."
          else
            gh release view "$TAG" --json body --jq .body > notes.md
            printf '\n' >> notes.md
            cat packaging/RELEASE-NOTES.md >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            dist/AngryKeyboard.dmg dist/AngryKeyboard.dmg.sha256 \
            feed/appcast.xml --clobber

      - name: Remove the certificate
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12
